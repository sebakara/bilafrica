name: Deploy

on:
  push:
    branches: [main]

jobs:
  # All three run on main. Audit starts after scan succeeds.
  # Deploy starts after audit succeeds.
  scan:
    uses: ./.github/workflows/security-malware-scan.yml

  audit:
    needs: scan
    if: ${{ needs.scan.result == 'success' }}
    uses: ./.github/workflows/audit.yml

  deploy:
    needs: audit
    if: ${{ needs.audit.result == 'success' }}
    runs-on: ubuntu-latest

    env:
      # The host comes from the SERVER_HOST secret. User and port default to
      # root and 22; override them with the SERVER_USER / SERVER_PORT variables.
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
      SERVER_USER: ${{ vars.SERVER_USER || 'root' }}
      SERVER_PORT: ${{ vars.SERVER_PORT || '22' }}
      DEPLOY_PATH: /var/www/bil

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build API
        run: pnpm --filter @bil/api build

      - name: Build Web
        run: pnpm --filter @bil/web build
        env:
          VITE_SITE_URL: ${{ vars.VITE_SITE_URL }}

      - name: Configure SSH
        run: |
          if [ -z "$SERVER_HOST" ]; then
            echo "ERROR: SERVER_HOST secret is not set in GitHub repository secrets."
            exit 1
          fi
          if [ -z "$SSH_KEY" ]; then
            echo "ERROR: SSH_PRIVATE_KEY_PROD secret is not set in GitHub repository secrets."
            exit 1
          fi
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          # Every later step reaches the server through the "prod" alias.
          printf 'Host prod\n  HostName %s\n  User %s\n  Port %s\n  StrictHostKeyChecking no\n  UserKnownHostsFile /dev/null\n  IdentityFile ~/.ssh/id_rsa\n  ConnectTimeout 15\n' \
            "$SERVER_HOST" "$SERVER_USER" "$SERVER_PORT" > ~/.ssh/config
          chmod 600 ~/.ssh/config
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY_PROD }}

      - name: Verify server prerequisites
        run: |
          ssh prod "
            set -e
            mkdir -p $DEPLOY_PATH
            test -w $DEPLOY_PATH
            command -v docker >/dev/null
            docker compose version >/dev/null
          "

      - name: Sync app to server
        run: |
          rsync -az --delete \
            --exclude='.git' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='node_modules' \
            --exclude='apps/api/.env' \
            --exclude='apps/api/.env.*' \
            --exclude='apps/web/.env' \
            --exclude='apps/web/.env.*' \
            --exclude='apps/api/.next' \
            --exclude='apps/web/dist' \
            ./ "prod:$DEPLOY_PATH/"

      - name: Restart services
        run: |
          ssh prod "
            set -e
            cd $DEPLOY_PATH
            docker compose up -d --build
            echo 'Deploy complete'
          "
