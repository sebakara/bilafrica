name: bil

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: bil
      MYSQL_USER: bil
      MYSQL_PASSWORD: bil
      MYSQL_ROOT_PASSWORD: bil-root
    ports:
      - "3307:3306"
    volumes:
      - bil-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-ubil", "-pbil"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3001
      HOSTNAME: 0.0.0.0
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: bil
      MYSQL_PASSWORD: bil
      MYSQL_DATABASE: bil
      CONTACT_EMAIL: ${CONTACT_EMAIL:-}
      CONTACT_FROM_EMAIL: ${CONTACT_FROM_EMAIL:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_SITE_URL: ${VITE_SITE_URL:-http://localhost:3000}
    ports:
      - "${PORT:-3000}:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  bil-mysql:
