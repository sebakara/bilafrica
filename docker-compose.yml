name: bil

services:
  mysql:
    image: mysql:8.4
    environment:
      # The same credentials the API uses, from the root .env. MySQL applies
      # them only when the bil-mysql volume is first created.
      MYSQL_DATABASE: ${MYSQL_DATABASE:-bil}
      BIL_DB_USER: ${MYSQL_USER:-bil}
      BIL_DB_PASSWORD: ${MYSQL_PASSWORD:-bil}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-bil-root}
    # The mysql image refuses MYSQL_USER=root, so when the .env user is root,
    # give root the .env password instead of creating a second user.
    entrypoint:
      - sh
      - -c
      - |
        if [ "$$BIL_DB_USER" = "root" ]; then
          export MYSQL_ROOT_PASSWORD="$$BIL_DB_PASSWORD"
        else
          export MYSQL_USER="$$BIL_DB_USER" MYSQL_PASSWORD="$$BIL_DB_PASSWORD"
        fi
        exec docker-entrypoint.sh mysqld
    ports:
      # Local development only: reachable from this machine, not the network.
      - "127.0.0.1:3307:3306"
    volumes:
      - bil-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u\"$$BIL_DB_USER\" -p\"$$BIL_DB_PASSWORD\""]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3001
      HOSTNAME: 0.0.0.0
      # Always the mysql service above, over Docker's own network. Only the
      # user, password, and database name come from the root .env.
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: ${MYSQL_USER:-bil}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-bil}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-bil}
      CONTACT_EMAIL: ${CONTACT_EMAIL:-}
      CONTACT_FROM_EMAIL: ${CONTACT_FROM_EMAIL:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_SITE_URL: ${VITE_SITE_URL:-http://localhost:3000}
    ports:
      # Only Apache on the same machine reaches the site; set PORT in .env to change it.
      - "127.0.0.1:${PORT:-3200}:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  bil-mysql:
